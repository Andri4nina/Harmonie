    <meta

      content="Harmonie, par Andrianina Rasoamanana : explorez les notes, gammes, accords et tonalités, écoutez-les et voyez ce qui les relie."

    <title>Andrianina Rasoamanana - Harmonie</title>
    <script>
      // Thème appliqué avant le premier affichage (même calcul que src/state/theme.ts).
      (function () {
        try {
          var choice = (JSON.parse(localStorage.getItem("harmonia-settings") || "{}").state || {}).theme || "system";
          var light = choice === "light" || (choice === "system" && matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.dataset.theme = light ? "light" : "dark";
        } catch (error) {}
      })();
    </script>
    <style>
      /* Écran de démarrage : styles en ligne, disponibles avant toute feuille. */
      #boot { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: #161a2e; transition: opacity 320ms ease-out; }
      #boot.is-done { opacity: 0; pointer-events: none; }
      [data-theme="light"] #boot { background: #eef0f6; }
      [data-theme="light"] #boot .boot-name { color: #161a2e; }
      [data-theme="light"] #boot .boot-splash { color: rgb(22 26 46 / 0.6); }
      #boot .boot-splash { display: flex; flex-direction: column; align-items: center; gap: 18px; color: rgb(236 230 216 / 0.6); font: 400 14px/1.4 system-ui, sans-serif; }
      #boot .boot-name { font: 700 26px/1 "Arial Black", system-ui, sans-serif; letter-spacing: -0.03em; color: #ece6d8; }
      #boot .boot-curve { color: #d9b46a; opacity: 0.6; }
      #boot .boot-note { fill: #ece6d8; }
      [data-theme="light"] #boot .boot-curve { color: #8a6526; }
      [data-theme="light"] #boot .boot-note { fill: #161a2e; }
      #boot .boot-bar { position: absolute; inset: 0 auto auto 0; height: 2px; width: 40%; background: linear-gradient(90deg, transparent, #d9b46a, transparent); animation: boot-bar 1.1s ease-in-out infinite; }
      @keyframes boot-bar { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      /* Page pré-rendue : son contenu est déjà lisible, seule la barre reste. */
      #root[data-prerendered] + #boot { inset: 0 0 auto; height: 2px; background: none; display: block; overflow: hidden; }
      #root[data-prerendered] + #boot .boot-splash { display: none; }
      @media (prefers-reduced-motion: reduce) { #boot * { animation: none !important; } }
    </style>
  </head>
