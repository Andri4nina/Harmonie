# Blueprint Render : l'API et le worker d'analyse, construits depuis ce dépôt.
# Render > New > Blueprint, choisir le dépôt. Les secrets (sync: false) sont
# demandés à la création ; voir docs/DEPLOYMENT.md pour leurs valeurs.

services:
  - type: web
    name: harmonie-api
    runtime: docker
    dockerfilePath: ./deploy/api.Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: WORKER_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: audio
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: RUST_LOG
        value: info

  # Un « background worker » n'existe pas en offre gratuite chez Render.
  - type: worker
    name: harmonie-worker
    runtime: docker
    dockerfilePath: ./deploy/worker.Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    autoDeploy: true
    envVars:
      - key: HARMONIE_API_URL
        sync: false
      - key: WORKER_TOKEN
        sync: false
