[package]
name = "harmonia-theory-wasm"
description = "Bindings WebAssembly du moteur de théorie d'Harmonia."
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
harmonia-theory = { path = "../harmonia-theory", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "=0.2.130"

[dev-dependencies]
serde_json = "1"
