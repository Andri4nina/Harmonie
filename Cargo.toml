[workspace]
resolver = "3"
# L'application de bureau (Tauri) a son propre espace : ses dépendances
# système (WebView) ne doivent pas peser sur les tests du moteur.
exclude = ["apps/desktop/src-tauri"]
members = ["crates/harmonia-theory", "crates/harmonia-theory-wasm", "crates/harmonia-audio", "crates/harmonia-api"]

[workspace.package]
version = "1.7.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Andri4nina/Harmonie"
authors = ["Andrianina Rasoamanana"]
