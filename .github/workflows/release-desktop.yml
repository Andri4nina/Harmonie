# Installateurs de l'application de bureau, publiés à chaque étiquette de
# version (vX.Y.Z) dans les « Releases » du dépôt, où la page Télécharger
# du site les trouve.
#
# Signature (facultative, voir docs/DEPLOYMENT.md) :
# - Windows : certificat de signature de code (secrets WINDOWS_CERTIFICATE,
#   WINDOWS_CERTIFICATE_PASSWORD) ;
# - macOS : compte Apple Developer (APPLE_CERTIFICATE…, notarisation).
# Sans ces secrets, les installateurs sont produits non signés.

name: Application de bureau

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown${{ startsWith(matrix.platform, 'macos') && ',aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: npm ci
        working-directory: apps/web
      - run: npm ci
        working-directory: apps/desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Harmonie ${{ github.ref_name }}"
          releaseBody: "Installateurs de l'application de bureau. Notes de version : CHANGELOG.md."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
