# Publication d'une version, à chaque étiquette vX.Y.Z, en même temps que le
# site (deploy-web.yml, même déclencheur) :
# - installateurs pour ordinateur (Windows, macOS, Linux) et fichier
#   latest.json signé, que lit la mise à jour automatique des applications ;
# - APK Android signé.
# Tout est joint à la publication GitHub ; la page Télécharger du site et les
# applications la lisent.
#
# Secrets (voir deploy/env) :
# - TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD : signature
#   des mises à jour (gratuite). Sans eux : installateurs sans mise à jour auto.
# - ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS :
#   signature de l'APK (gratuite). Sans eux : APK non publié.
# Lancé à la main (sans étiquette), le workflow construit sans rien publier.

name: Publication

on:
  push:
    tags: ["v*"]
    # Essai complet de la chaîne, sans rien publier (pas d'étiquette).
    branches: ["publication-essai"]
  workflow_dispatch:

permissions:
  contents: write

env:
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown${{ startsWith(matrix.platform, 'macos') && ',aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: npm ci
        working-directory: apps/web
      - run: npm ci
        working-directory: apps/desktop
      - name: Signature des mises à jour
        id: updater
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY absent, installateurs produits sans mise à jour automatique."
            echo "args=-c src-tauri/tauri.noupdate.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.IS_TAG == 'true' && github.ref_name || '' }}
          releaseName: "Harmonie ${{ github.ref_name }}"
          releaseBody: "Site, applications pour ordinateur et APK Android de la même version. Notes de version dans CHANGELOG.md."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}

  android:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: npm ci
        working-directory: apps/web
      - run: npm ci
        working-directory: apps/desktop
      - name: Construire l'APK
        working-directory: apps/desktop
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init --ci
          npx tauri android build --apk --ci
      - name: Signer l'APK
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          APK=$(ls apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          OUT="Harmonie_${VERSION}_android.apk"
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Clé Android absente, APK non signé donc non publié."
            cp "$APK" "unsigned-$OUT"
            echo "file=unsigned-$OUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.p12
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$TOOLS/zipalign" -f -p 4 "$APK" aligned.apk
          "$TOOLS/apksigner" sign --ks keystore.p12 --ks-type PKCS12 --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" --out "$OUT" aligned.apk
          "$TOOLS/apksigner" verify --print-certs "$OUT"
          rm -f keystore.p12 aligned.apk
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: ${{ steps.sign.outputs.file }}
      - name: Joindre l'APK à la publication
        if: env.IS_TAG == 'true' && steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.sign.outputs.file }}" --clobber
