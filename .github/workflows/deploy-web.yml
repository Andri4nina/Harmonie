# Construit le site (moteur WASM + pré-rendu) et le publie sur Vercel.
#
# Secrets du dépôt : VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Variables du dépôt : celles de deploy/env/vercel.env.example, mêmes noms
# (VITE_SITE_URL, VITE_API_URL, VITE_SUPABASE_URL,
# VITE_SUPABASE_PUBLISHABLE_KEY, VITE_GOOGLE_SITE_VERIFICATION).

name: Site web

on:
  # Publié avec les applications, à chaque version (voir release.yml).
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run wasm
      - run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.VITE_GOOGLE_SITE_VERIFICATION }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - run: cp vercel.json dist/
      # Sans jeton Vercel (projet pas encore créé), le site est construit et
      # vérifié, mais pas publié.
      - name: Publier sur Vercel
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@latest deploy dist --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Publication sautée
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "Secrets Vercel absents (voir docs/DEPLOYMENT.md) - site construit, non publié."
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
