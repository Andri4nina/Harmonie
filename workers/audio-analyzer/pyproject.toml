[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonia-worker"
version = "1.7.0"
description = "Worker audio d'Harmonia : extraction des descripteurs du signal."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "Andrianina Rasoamanana" }]
dependencies = ["librosa>=1.0", "numpy>=2.4", "soundfile>=0.14"]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Seul le worker est installé ; « evaluation » et « tests » restent des
# dossiers de travail du dépôt.
[tool.setuptools]
packages = ["harmonia_worker"]
